name: Basic CI - Performance Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'

    - name: Convert line endings and setup gradlew
      run: |
        echo "🔧 Converting gradlew line endings from Windows to Unix..."
        # Convertir CRLF (Windows) a LF (Linux) para evitar errores de $'\r': command not found
        sed -i 's/\r$//' gradlew
        # Dar permisos de ejecución
        chmod +x gradlew
        echo "✅ gradlew ready for execution"
        ls -la gradlew

    - name: Build project
      run: ./gradlew clean build

    - name: Run performance tests
      run: ./gradlew gatlingRun

    - name: Upload reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-reports
        path: build/reports/gatling/